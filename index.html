<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>오리온 · 비밀번호 생성기</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>오리온</h1>
      <p>안전한 비밀번호를 하나 만든다.</p>

      <form>
        <label>
          길이
          <input id="length" name="length" type="number" min="1" max="128" required />
        </label>

        <fieldset>
          <legend>포함할 문자</legend>
          <label><input name="type" id="uppercase" type="checkbox" /> 대문자</label>
          <label><input name="type" id="lowercase" type="checkbox" /> 소문자</label>
          <label><input name="type" id="numbers" type="checkbox" /> 숫자</label>
          <label><input name="type" id="symbols" type="checkbox" /> 특수문자</label>
        </fieldset>

        <label><input id="excludeAmbiguous" type="checkbox" /> 혼동 문자(0, O, 1, l, I) 제외</label>
        <p class="hint">허용 특수문자: <code id="special-characters"></code></p>

        <button type="submit">비밀번호 생성</button>
      </form>

      <label>
        생성 결과
        <input id="result" type="text" readonly aria-live="polite" />
      </label>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
